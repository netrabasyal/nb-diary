name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * 0' # weekly, Monday morning in Australia

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Findings are shown as annotations (file, line, rule) with the value redacted.
      - name: Scan for committed secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 0 \
            --report-format json --report-path /repo/gitleaks.json
          count=$(jq length gitleaks.json)
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID) in commit \(.Commit[0:7])"' gitleaks.json
          if [ "$count" -gt 0 ]; then
            echo "$count possible secret(s) found"
            exit 1
          fi
